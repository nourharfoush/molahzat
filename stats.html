<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عدد ملاحظات كل عضو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f6f2;--card:#fff;--ink:#16302a;--muted:#6a7a74;--line:#dde3de;--green:#1d5c4b;--green-d:#134035;--gold:#b58a2f;--err:#b3372b}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;padding-bottom:40px}
header{background:var(--green-d);color:#fff;padding:18px 16px 16px}
header h1{margin:0;font-size:1.15rem;font-weight:700}
header p{margin:2px 0 0;font-size:.85rem;color:#b9d2c9}
header a{color:#e9d9a8;font-size:.85rem}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
.sum{display:flex;gap:10px;margin:14px 0}
.sum div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sum b{display:block;font-size:1.4rem;color:var(--green)}
.sum span{font-size:.8rem;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
input[type=search],input[type=password],select{font:inherit;color:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px}
input[type=search]{flex:2;min-width:160px}
select{flex:1;min-width:130px}
input:focus,select:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
.btn{font:inherit;font-weight:600;border:1px solid var(--green);background:#fff;color:var(--green);border-radius:10px;padding:10px 14px;cursor:pointer}
.btn:hover{background:var(--green);color:#fff}
.chk{display:block;margin-top:10px;font-size:.88rem;color:var(--muted)}
.note{display:flex;gap:8px;width:100%}
.note em{flex:none}
.note span{color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.top{display:flex;align-items:center;gap:12px}
.info{flex:1;min-width:0}
.nm{font-weight:600}
.jb{font-size:.8rem;color:var(--muted)}
.bar{height:6px;background:#e8eee9;border-radius:99px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.cnt{flex:none;text-align:center;min-width:54px}
.cnt b{display:block;font-size:1.25rem;color:var(--green);line-height:1.1}
.cnt span{font-size:.72rem;color:var(--muted)}
.days{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.85rem}
.m.open .days{display:flex;flex-direction:column;gap:6px}
.days em{font-style:normal;background:#e5f0eb;color:var(--green);border-radius:8px;padding:2px 10px;font-size:.8rem}
.msg{text-align:center;color:var(--muted);padding:40px 10px}
.gate{position:fixed;inset:0;background:rgba(22,48,42,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.gate.show{display:flex}
.gate .box{background:#fff;border-radius:14px;padding:22px;max-width:340px;width:100%}
.gate h2{margin:0 0 12px;font-size:1.05rem}
.gate input{width:100%}
.gate button{margin-top:12px;width:100%;font:inherit;font-weight:700;border:0;border-radius:10px;background:var(--green);color:#fff;padding:11px;cursor:pointer}
.gate .e{color:var(--err);font-size:.85rem;margin-top:8px;min-height:1.2em}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>عدد ملاحظات كل عضو</h1>
    <p>رواق العلوم الشرعية والعربية · البحيرة · <a href="index.html">العودة لإدخال الملاحظات</a></p>
  </div>
</header>

<main class="wrap">
  <div class="sum">
    <div><b id="sMembers">–</b><span>عدد الأعضاء</span></div>
    <div><b id="sNotes">–</b><span>إجمالي الملاحظات</span></div>
    <div><b id="sMax">–</b><span>أكثر عدد ملاحظات لعضو</span></div>
  </div>

  <div class="tools">
    <input type="search" id="q" placeholder="ابحث بالاسم" aria-label="بحث">
    <select id="sort" aria-label="الترتيب">
      <option value="desc">الأكثر ملاحظات</option>
      <option value="asc">الأقل ملاحظات</option>
      <option value="name">أبجديًا</option>
    </select>
    <button class="btn" id="csv">تصدير Excel</button>
  </div>

  <label class="chk"><input type="checkbox" id="skipPresent"> لا تحسب كلمة «حضر» كملاحظة</label>

  <div id="list" class="list"><div class="msg">جاري التحميل…</div></div>
</main>

<div class="gate" id="gate">
  <div class="box">
    <h2>كود الدخول</h2>
    <input type="password" id="code" autocomplete="off">
    <div class="e" id="gerr"></div>
    <button id="gok">دخول</button>
  </div>
</div>

<script>
/* نفس الرابط المستخدم في index.html */
const API_URL = 'https://script.google.com/macros/s/AKfycbyS0B3xiWrtHC_NIiaAbwh633j6dYW1QvrqlWYdIaCVpMseokOzpjx6CQwqSRq4X8CUIg/exec';

const $ = id => document.getElementById(id);
let code = localStorage.getItem('code') || '';
let data = { totalDays: 0, members: [] };

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function askCode(msg){
  return new Promise(res => {
    $('gerr').textContent = msg || '';
    $('gate').classList.add('show'); $('code').value=''; $('code').focus();
    const done = () => {
      const v = $('code').value.trim(); if (!v) return;
      code = v; localStorage.setItem('code', v);
      $('gate').classList.remove('show'); res();
    };
    $('gok').onclick = done;
    $('code').onkeydown = e => { if (e.key === 'Enter') done(); };
  });
}

async function load(){
  if (API_URL.startsWith('PASTE')){ $('list').innerHTML = '<div class="msg">ضع رابط الخدمة في API_URL داخل الملف.</div>'; return; }
  if (!code) await askCode();
  try{
    const u = new URL(API_URL);
    u.searchParams.set('action','stats'); u.searchParams.set('code', code);
    const j = await (await fetch(u)).json();
    if (!j.ok) throw new Error(j.error);
    data = j.stats;
    render();
  }catch(e){
    if (e.message.includes('كود')){ await askCode(e.message); return load(); }
    $('list').innerHTML = `<div class="msg">تعذر التحميل: ${esc(e.message)}</div>`;
  }
}

function notesOf(m){
  return $('skipPresent').checked ? m.notes.filter(n => n.note.trim() !== 'حضر') : m.notes;
}

function view(){
  const q = $('q').value.trim();
  let rows = data.members.filter(m => !q || m.name.includes(q))
    .map(m => ({ ...m, ns: notesOf(m) }));
  const s = $('sort').value;
  const byName = (a,b) => a.name.localeCompare(b.name,'ar');
  rows.sort((a,b) =>
    s === 'name' ? byName(a,b) :
    s === 'asc'  ? a.ns.length - b.ns.length || byName(a,b) :
                   b.ns.length - a.ns.length || byName(a,b));
  return rows;
}

function render(){
  const all = data.members.map(m => notesOf(m).length);
  $('sMembers').textContent = data.members.length;
  $('sNotes').textContent = all.reduce((a,b) => a + b, 0);
  $('sMax').textContent = all.length ? Math.max(...all) : 0;

  const rows = view();
  if (!rows.length){ $('list').innerHTML = '<div class="msg">لا توجد أسماء مطابقة.</div>'; return; }
  const max = Math.max(1, ...rows.map(m => m.ns.length));
  $('list').innerHTML = rows.map(m => `
    <div class="m">
      <div class="top">
        <div class="info">
          <div class="nm">${esc(m.name)}</div>
          <div class="jb">${esc(m.job)} · ظهر في ${m.count} يوم</div>
          <div class="bar"><i style="width:${Math.round(m.ns.length/max*100)}%"></i></div>
        </div>
        <div class="cnt"><b>${m.ns.length}</b><span>ملاحظة</span></div>
      </div>
      <div class="days">${m.ns.length
        ? m.ns.map(n => `<div class="note"><em>${esc(n.day)}</em><span>${esc(n.note)}</span></div>`).join('')
        : '<span style="color:var(--muted)">لا توجد ملاحظات مسجلة.</span>'}</div>
    </div>`).join('');
}

$('list').addEventListener('click', e => { const c = e.target.closest('.m'); if (c) c.classList.toggle('open'); });
$('q').addEventListener('input', render);
$('sort').addEventListener('change', render);
$('skipPresent').addEventListener('change', render);

$('csv').addEventListener('click', () => {
  const q = s => `"${String(s).replace(/"/g,'""')}"`;
  const lines = [['الاسم','جهة العمل','عدد الملاحظات','عدد أيام الظهور','الملاحظات'].map(q).join(',')]
    .concat(view().map(m => [m.name, m.job, m.ns.length, m.count, m.ns.map(n => n.day + ': ' + n.note).join(' | ')].map(q).join(',')));
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'ملاحظات-الأعضاء.csv'; a.click();
  URL.revokeObjectURL(a.href);
});

load();
</script>
</body>
</html>
