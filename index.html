<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملاحظات امتحانات العلوم الشرعية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f6f2; --card:#ffffff; --ink:#16302a; --muted:#6a7a74;
  --line:#dde3de; --green:#1d5c4b; --green-d:#134035; --gold:#b58a2f;
  --dirty:#fff7e0; --ok:#1d7a4f; --err:#b3372b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;background:var(--paper);color:var(--ink);
  line-height:1.6;padding-bottom:110px}
header{background:var(--green-d);color:#fff;padding:18px 16px 16px}
header h1{margin:0;font-size:1.15rem;font-weight:700}
header p{margin:2px 0 0;font-size:.85rem;color:#b9d2c9}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.bar .row{display:flex;gap:8px}
select,input[type=search],input[type=password],textarea{
  font:inherit;color:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;width:100%}
select{flex:1.3}
input[type=search]{flex:1}
select:focus,input:focus,textarea:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:8px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:background .2s,border-color .2s}
.m.dirty{background:var(--dirty);border-color:#e6cf86}
.m.done{border-color:var(--ok)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.nm{font-weight:600;font-size:1rem}
.jb{font-size:.82rem;color:var(--muted)}
.tag{flex:none;font-size:.78rem;font-weight:600;color:var(--green);background:#e5f0eb;border-radius:8px;padding:2px 10px;white-space:nowrap}
textarea{margin-top:10px;min-height:44px;resize:vertical;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:999px;padding:3px 12px;cursor:pointer}
.chips button:hover{border-color:var(--green);color:var(--green)}
.savebar{position:fixed;inset:auto 0 0 0;background:#fff;border-top:1px solid var(--line);padding:12px 14px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.savebar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
#status{flex:1;font-size:.9rem;color:var(--muted)}
#status.ok{color:var(--ok)} #status.err{color:var(--err)}
#save{font:inherit;font-weight:700;border:0;border-radius:10px;background:var(--green);color:#fff;
  padding:12px 26px;cursor:pointer;min-width:150px}
#save:disabled{background:#b9c7c1;cursor:default}
#save:not(:disabled):hover{background:var(--green-d)}
.empty,.msg{text-align:center;color:var(--muted);padding:40px 10px}
.gate{position:fixed;inset:0;background:rgba(22,48,42,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.gate.show{display:flex}
.gate .box{background:#fff;border-radius:14px;padding:22px;max-width:340px;width:100%}
.gate h2{margin:0 0 4px;font-size:1.05rem}
.gate p{margin:0 0 12px;color:var(--muted);font-size:.88rem}
.gate button{margin-top:12px;width:100%;font:inherit;font-weight:700;border:0;border-radius:10px;background:var(--green);color:#fff;padding:11px;cursor:pointer}
.gate .e{color:var(--err);font-size:.85rem;margin-top:8px;min-height:1.2em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>ملاحظات امتحانات رواق العلوم الشرعية والعربية</h1>
    <p>الأزهر الشريف · فرع رواق البحيرة · نوفمبر 2026</p>
  </div>
</header>

<main class="wrap">
  <div class="bar">
    <div class="row">
      <select id="day" aria-label="اليوم"></select>
      <input type="search" id="q" placeholder="ابحث بالاسم" aria-label="بحث">
    </div>
    <div class="meta"><span id="count"></span><a href="#" id="logout" style="color:var(--muted)">تغيير كود الدخول</a></div>
  </div>
  <div id="list" class="list"><div class="msg">جاري التحميل…</div></div>
</main>

<div class="savebar">
  <div class="in">
    <div id="status"></div>
    <button id="save" disabled>حفظ التعديلات</button>
  </div>
</div>

<div class="gate" id="gate">
  <div class="box">
    <h2>كود الدخول</h2>
    <p>اكتب الكود الذي أعطاه لك المسؤول.</p>
    <input type="password" id="code" autocomplete="off">
    <div class="e" id="gerr"></div>
    <button id="gok">دخول</button>
  </div>
</div>

<script>
/* ===== الإعداد: ضع رابط Web App من Apps Script هنا ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbw3inEzm8yvGMDHXHX55up12Eljg6fOe9WarVo00jnScuzdIG_pZqqlKHm_rXV9AsFi1A/exec';
/* ======================================================= */

const QUICK = ['حضر', 'غائب', 'متأخر', 'انصراف مبكر'];
const $ = id => document.getElementById(id);
const state = { day: '', rows: [], edits: new Map() };   // edits: row -> note
let code = localStorage.getItem('code') || '';

function setStatus(t, cls){ const s=$('status'); s.textContent=t||''; s.className=cls||''; }
function updateSave(){
  const n = state.edits.size;
  $('save').disabled = n === 0;
  $('save').textContent = n ? `حفظ التعديلات (${n})` : 'حفظ التعديلات';
  if (n && !$('status').classList.contains('err')) setStatus(`${n} تعديل لم يُحفظ بعد`);
  if (!n && !$('status').classList.contains('ok')) setStatus('');
}

async function get(params){
  const u = new URL(API_URL);
  Object.entries({ ...params, code }).forEach(([k,v]) => u.searchParams.set(k, v));
  const r = await fetch(u);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j;
}

async function post(body){
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...body, code })
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j;
}

function askCode(msg){
  return new Promise(res => {
    $('gerr').textContent = msg || '';
    $('gate').classList.add('show');
    $('code').value = ''; $('code').focus();
    const done = () => {
      const v = $('code').value.trim();
      if (!v) return;
      code = v; localStorage.setItem('code', v);
      $('gate').classList.remove('show');
      $('gok').onclick = null; $('code').onkeydown = null;
      res();
    };
    $('gok').onclick = done;
    $('code').onkeydown = e => { if (e.key === 'Enter') done(); };
  });
}

function pickToday(days){
  const d = new Date();
  const norm = s => s.replace(/\s+/g,'').replace(/\b0(\d)/g,'$1');
  const today = `${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}`;
  return days.find(x => norm(x).includes(today)) || days[0];
}

async function init(){
  if (API_URL.startsWith('PASTE')){
    $('list').innerHTML = '<div class="msg">لم يتم ضبط رابط الخدمة بعد. افتح index.html وضع الرابط في API_URL.</div>';
    return;
  }
  if (!code) await askCode();
  try{
    const { days } = await get({ action: 'days' });
    $('day').innerHTML = days.map(d => `<option>${d}</option>`).join('');
    $('day').value = pickToday(days);
    await loadDay();
  }catch(e){
    if (e.message.includes('كود')){ await askCode(e.message); return init(); }
    $('list').innerHTML = `<div class="msg">تعذر التحميل: ${e.message}</div>`;
  }
}

async function loadDay(){
  state.day = $('day').value;
  state.edits.clear(); updateSave();
  $('list').innerHTML = '<div class="msg">جاري التحميل…</div>';
  try{
    const { rows } = await get({ action: 'rows', sheet: state.day });
    state.rows = rows;
    render();
  }catch(e){
    $('list').innerHTML = `<div class="msg">تعذر التحميل: ${e.message}</div>`;
  }
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const q = $('q').value.trim();
  const rows = state.rows.filter(r => !q || r.name.includes(q));
  $('count').textContent = `${rows.length} من ${state.rows.length}`;
  if (!rows.length){ $('list').innerHTML = '<div class="empty">لا توجد أسماء مطابقة.</div>'; return; }
  $('list').innerHTML = rows.map(r => {
    const val = state.edits.has(r.row) ? state.edits.get(r.row) : r.note;
    return `<div class="m ${state.edits.has(r.row)?'dirty':''}" data-row="${r.row}">
      <div class="top">
        <div><div class="nm">${esc(r.name)}</div><div class="jb">${esc(r.job)}</div></div>
        ${r.committee ? `<div class="tag">${esc(r.committee)}</div>` : ''}
      </div>
      <textarea rows="1" placeholder="اكتب الملاحظة…">${esc(val)}</textarea>
      <div class="chips">${QUICK.map(c => `<button type="button" data-q="${c}">${c}</button>`).join('')}</div>
    </div>`;
  }).join('');
}

function setNote(card, text){
  const row = +card.dataset.row;
  const orig = state.rows.find(r => r.row === row).note;
  if (text === orig) state.edits.delete(row); else state.edits.set(row, text);
  card.classList.toggle('dirty', state.edits.has(row));
  card.classList.remove('done');
  $('status').className = '';
  updateSave();
}

$('list').addEventListener('input', e => {
  if (e.target.tagName === 'TEXTAREA') setNote(e.target.closest('.m'), e.target.value.trim());
});
$('list').addEventListener('click', e => {
  const b = e.target.closest('button[data-q]');
  if (!b) return;
  const card = b.closest('.m'), ta = card.querySelector('textarea');
  ta.value = b.dataset.q;
  setNote(card, ta.value);
  ta.focus();
});

$('q').addEventListener('input', render);
$('day').addEventListener('change', () => {
  if (state.edits.size && !confirm('يوجد تعديلات لم تُحفظ. هل تريد تجاهلها؟')){ $('day').value = state.day; return; }
  loadDay();
});
$('logout').addEventListener('click', async e => {
  e.preventDefault(); localStorage.removeItem('code'); code=''; await askCode(); init();
});

$('save').addEventListener('click', async () => {
  const updates = [...state.edits].map(([row, note]) => ({ row, note, name: state.rows.find(r => r.row === row).name }));
  $('save').disabled = true; setStatus('جاري الحفظ…');
  try{
    const res = await post({ sheet: state.day, updates });
    updates.forEach(u => { state.rows.find(r => r.row === u.row).note = u.note; });
    const skipped = res.skipped || [];
    state.edits.clear();
    document.querySelectorAll('.m.dirty').forEach(c => { c.classList.remove('dirty'); c.classList.add('done'); });
    updateSave();
    if (skipped.length){ setStatus(`تم حفظ ${res.saved}، وتخطي ${skipped.length} لأن الشيت تغيّر. حدّث الصفحة.`, 'err'); }
    else setStatus(`تم حفظ ${res.saved} ملاحظة`, 'ok');
  }catch(e){
    setStatus(e.message, 'err'); $('save').disabled = false;
  }
});

window.addEventListener('beforeunload', e => { if (state.edits.size){ e.preventDefault(); e.returnValue=''; } });

init();
</script>
</body>
</html>
